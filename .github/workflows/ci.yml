name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # The JDK scripts/fetch-java.mjs builds Java's runtime files from (~210 MB),
          # and the NuGet packages scripts/fetch-csharp.mjs builds C#'s from.
          path: |
            node_modules/.cache/opcode-java
            node_modules/.cache/opcode-csharp
          key: toolchains-${{ hashFiles('scripts/fetch-java.mjs', 'scripts/fetch-csharp.mjs') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # The Wasmer packages the terminals run (scripts/wasmer-packages.mjs, ~255 MB).
          path: public/wasmer
          key: wasmer-packages-${{ hashFiles('wasmer-packages.lock.json') }}
      - run: npm run check
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Chromium)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # The JDK scripts/fetch-java.mjs builds Java's runtime files from (~210 MB),
          # and the NuGet packages scripts/fetch-csharp.mjs builds C#'s from.
          path: |
            node_modules/.cache/opcode-java
            node_modules/.cache/opcode-csharp
          key: toolchains-${{ hashFiles('scripts/fetch-java.mjs', 'scripts/fetch-csharp.mjs') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # The Wasmer packages the terminals run (scripts/wasmer-packages.mjs, ~255 MB).
          path: public/wasmer
          key: wasmer-packages-${{ hashFiles('wasmer-packages.lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  docker:
    name: Docker image
    # Only a main whose tests pass is published as :latest, which compose.yaml pulls.
    needs: [check, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: opcode:ci
      - name: Serve it, and check the headers, settings and compressed files
        run: |
          docker run -d --name opcode -p 8080:8080 -e OPCODE_RELAY=on -e OPCODE_PREVIEW_HOST='http://*.localhost:8080/' opcode:ci
          for i in $(seq 30); do curl -sf -o /dev/null http://localhost:8080/ && break; sleep 1; done
          curl -sfI http://localhost:8080/ | grep -i '^cross-origin-embedder-policy: require-corp'
          curl -sf http://localhost:8080/config.js | grep '"relay": "/wisp/"'
          curl -sfI -H 'Host: p1.localhost:8080' http://localhost:8080/.wasmer/host.html | grep -i '^cross-origin-resource-policy: cross-origin'
          llvm=$(docker exec opcode ls dist/assets | grep -m1 '^llvm\.core-') # Clang's compiler (core2, core3... are its other parts)
          curl -sfI -H 'Accept-Encoding: br' "http://localhost:8080/assets/$llvm" | grep -i '^content-encoding: br'
      - if: failure()
        run: docker logs opcode
      # The image the publish job pushes, tested above (only from main).
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save opcode:ci -o opcode.tar
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docker-image
          path: opcode.tar
          retention-days: 1

  publish:
    # What's on main is published as ghcr.io/<owner>/<repository>:latest
    # (and :sha-<commit>), which compose.yaml runs. A job of its own, so the
    # token that can write packages never reaches the build or its actions.
    name: Publish the Docker image
    needs: [check, e2e, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docker-image
      - name: Publish to GitHub's container registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker load -i opcode.tar
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for tag in latest "sha-${GITHUB_SHA::7}"; do
            docker tag opcode:ci "$image:$tag"
            docker push "$image:$tag"
          done

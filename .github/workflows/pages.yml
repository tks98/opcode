name: GitHub Pages

# Builds Opcode and publishes it with GitHub Pages, on every push to main.
# Turn it on once in the repository's Settings > Pages (Source: GitHub
# Actions). Pages can't send the cross-origin isolation headers Opcode needs,
# so public/coi-serviceworker.js adds them in the browser (the first visit
# reloads once). opcode-dev.com is behind Cloudflare, which sends them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # The JDK scripts/fetch-java.mjs builds Java's runtime files from (~210 MB),
          # and the NuGet packages scripts/fetch-csharp.mjs builds C#'s from.
          path: |
            node_modules/.cache/opcode-java
            node_modules/.cache/opcode-csharp
          key: toolchains-${{ hashFiles('scripts/fetch-java.mjs', 'scripts/fetch-csharp.mjs') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          # The Wasmer packages the terminals run (scripts/wasmer-packages.mjs, ~255 MB).
          path: public/wasmer
          key: wasmer-packages-${{ hashFiles('wasmer-packages.lock.json') }}
      - run: npm run build
        env:
          # A Cloudflare Worker: deploy/preview-host.wrangler.toml.
          VITE_PREVIEW_HOST: https://preview.opcode-dev.com/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
